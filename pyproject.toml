[project]
name = "OmniMCP"
version = "0.2.0"
description = "Extensible Linux MCP control with durable jobs and Hyprland desktop automation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["hyprland", "mcp", "wayland", "desktop-automation", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: Window Managers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["mcp==1.30.0", "psutil>=7.0,<8", "typing-extensions>=4.12"]

[project.scripts]
"OmniMCP" = "omnimcp.cli:main"
"omnimcp" = "omnimcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnimcp"]

# Keep the bundled skill version-matched with the package.
[tool.hatch.build.targets.wheel.force-include]
"skills/omnimcp" = "omnimcp/skill"

[tool.hatch.build.targets.sdist]
include = [
    "/src/omnimcp", "/skills/omnimcp", "/tests",
    "/README.md", "/LICENSE", "/CHANGELOG.md", "/ARCHITECTURE.md",
    "/docs", "/scripts", "/packaging/systemd",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=7,<8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: needs a live Hyprland session",
    "background: drives apps on the agent's workspaces in a live session",
]
addopts = "-m 'not e2e and not background'"

[tool.coverage.run]
source = ["omnimcp"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
# Audited commit measured 82.65% with subprocess coverage; keep the integer floor.
fail_under = 82
show_missing = true
skip_covered = true
