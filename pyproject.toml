[project]
name = "agentic-os-mcp"
version = "0.2.0"
description = "Extensible Linux MCP control with durable jobs and Hyprland desktop automation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["hyprland", "mcp", "wayland", "desktop-automation", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: Window Managers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["mcp==1.30.0", "psutil>=7.0,<8"]

[project.scripts]
"agentic-os-mcp" = "agentic_os_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_os_mcp"]

# Keep the bundled skill version-matched with the package.
[tool.hatch.build.targets.wheel.force-include]
"skills/agentic-os-mcp" = "agentic_os_mcp/skill"

[tool.hatch.build.targets.sdist]
include = [
    "/src/agentic_os_mcp", "/skills/agentic-os-mcp", "/tests",
    "/README.md", "/LICENSE", "/CHANGELOG.md", "/ARCHITECTURE.md",
    "/docs", "/scripts", "/packaging/systemd",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: needs a live Hyprland session",
    "background: drives apps on the agent's workspaces in a live session",
]
addopts = "-m 'not e2e and not background'"
